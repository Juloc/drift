<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efb1a6">
<title>Drift - look probe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%23d93a64%27/%3E%3Cpath d=%27M7 21c3-9 9-12 14-9l-4 2c-3-1-6 1-8 7z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="probe.css">
</head>
<body>
<!-- A look probe for pictures (not the game): a meeting place on a mountain pass in the soft sunset look of the mockup with the new HUD.
     ?tier=high|low  ?touch=1  ?view=drive|overview  ?t=seconds simulated before the first frame  ?run=1 keeps driving  ?lang=de|en  ?hud=plain|driver  ?debug=1 -->
<canvas id="view" tabindex="0" aria-label="Drift look probe"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="phud" aria-live="off"></div>
<pre id="pdebug" hidden></pre>

<nav id="touch" aria-label="Controls" hidden>
  <div class="pad left">
    <button type="button" class="btn steer" data-ctl="left" aria-label="Steer left">&#9664;</button>
    <button type="button" class="btn steer" data-ctl="right" aria-label="Steer right">&#9654;</button>
  </div>
  <div class="pad right">
    <button type="button" class="btn small" data-ctl="hand" aria-label="Handbrake"><span data-t="handBtn">HAND</span></button>
    <button type="button" class="btn small" data-ctl="brake" aria-label="Brake"><span data-t="brakeBtn">BRAKE</span></button>
    <button type="button" class="btn gas" data-ctl="gas" aria-label="Throttle"><span data-t="gasBtn">GAS</span></button>
  </div>
</nav>

<script type="module" src="lookprobe.js"></script>
</body>
</html>
