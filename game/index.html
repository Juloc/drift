<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8fc7ee">
<title>Drift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%233a7de0%27/%3E%3Cpath d=%27M7 21c3-9 9-12 14-9l-4 2c-3-1-6 1-8 7z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view" tabindex="0" aria-label="Drift game"></canvas>

<div id="hud" aria-live="off">
  <div id="speed"><span id="speed-n">0</span><small>km/h</small></div>
  <div id="drift">
    <span id="d-label" class="label" data-t="drift">DRIFT</span>
    <span id="d-pts" class="pts">0</span>
    <span id="d-mult" class="mult">x1</span>
    <span class="bar"></span>
  </div>
  <div id="bank"><small data-t="score">Score</small> <b id="bank-n">0</b></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<p id="hint" class="hint" data-t="hintKeys"></p>
<pre id="debug" hidden></pre>
<div id="rotate" hidden data-t="rotate"></div>

<nav id="touch" aria-label="Controls" hidden>
  <div class="pad left">
    <button type="button" class="btn steer" data-ctl="left" aria-label="Steer left">&#9664;</button>
    <button type="button" class="btn steer" data-ctl="right" aria-label="Steer right">&#9654;</button>
  </div>
  <div class="pad right">
    <button type="button" class="btn small" data-ctl="hand" aria-label="Handbrake"><span data-t="hand">HAND</span></button>
    <button type="button" class="btn small" data-ctl="brake" aria-label="Brake"><span data-t="brake">BRAKE</span></button>
    <button type="button" class="btn gas" data-ctl="gas" aria-label="Throttle"><span data-t="gas">GAS</span></button>
  </div>
</nav>

<script type="module" src="main.js"></script>
</body>
</html>
