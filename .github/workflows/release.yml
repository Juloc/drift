# Publishes the image of a release: ghcr.io/juloc/drift:<version> (the app, with the game's files).
# Runs only for a version tag (v0.1.0); the tag must equal the version in Directory.Build.props, so an image never carries a version that is not the one in the code.
# Nothing is pushed from a developer's machine. The deploy/stack/docker-compose.yml pins the tag this workflow makes.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE: ghcr.io/juloc/drift

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: The tag is the version of the code
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -1)
          [ "$version" = "$code" ] || { echo "tag $version, but Directory.Build.props says $code"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the code
        run: dotnet build Drift.slnx

      - name: Build the images
        run: |
          docker build -t "$APP_IMAGE:$VERSION" --build-arg COMMIT="$GITHUB_SHA" .

      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE:$VERSION"
          # the digest is what the owner may pin in the stack file instead of the tag
          docker inspect --format '{{index .RepoDigests 0}}' "$APP_IMAGE:$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
